name = "api-enhanced-for-cloudflare"
main = "src/worker.js"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
CORS_ALLOW_ORIGIN = ""
ENABLE_GENERAL_UNBLOCK = "false"
ENABLE_PROXY = "false"
ENABLE_RANDOM_CN_IP = "false"
PROXY_URL = ""
NETEASE_COOKIE = ""
CHECK_TOKEN_V2 = ""
CHECK_TOKEN_V3 = ""
